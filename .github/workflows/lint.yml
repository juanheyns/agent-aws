name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check

      - name: Syntax check (py_compile)
        run: python -m py_compile bin/agent-aws

      - name: Version consistency (pyproject.toml ↔ bin/agent-aws)
        run: |
          python - <<'PY'
          import re
          import sys
          import tomllib
          with open("pyproject.toml", "rb") as f:
              pyproject_version = tomllib.load(f)["project"]["version"]
          script = open("bin/agent-aws").read()
          m = re.search(r'^__version__\s*=\s*"([^"]+)"', script, re.M)
          if not m:
              sys.exit("bin/agent-aws missing __version__ constant")
          script_version = m.group(1)
          if pyproject_version != script_version:
              sys.exit(
                  f"version mismatch: pyproject={pyproject_version} script={script_version}"
              )
          print(f"ok: {pyproject_version}")
          PY

  sandbox:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install bubblewrap and enable test namespaces
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Unit and sandbox acceptance tests (fake AWS, scratch HOME)
        run: python -m unittest discover -s tests -v

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs Material
        run: pip install "mkdocs-material>=9"

      - name: Build docs (strict)
        run: mkdocs build --strict
